name: Bug report
description: Report a bug or unexpected behavior
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm before submitting.
      options:
        - label: I searched existing issues and did not find a similar report
          required: true
        - label: I am using the latest version or latest commit of the project
          required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly and with as much detail as possible.
      placeholder: |
        Example: When I run ... the tool ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Run...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, OS, tool versions, and configuration.
      placeholder: |
        - OS:
        - Node.js:
        - Terraform:
        - Docker:
        - Browser:
        - Repo / branch:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste any relevant terminal output, stack traces, or log excerpts.
      render: shell
