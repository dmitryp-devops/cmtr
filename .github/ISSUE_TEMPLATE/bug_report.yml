name: Bug report
description: Report a bug or unexpected behavior in cmtr.
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug. Please fill out the details below so we can reproduce and fix it.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: A clear and concise description of the problem.
      placeholder: Describe what happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Execute ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
      placeholder: Describe the actual behavior, including errors or logs.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running cmtr?
      options:
        - Local machine
        - CI/CD runner
        - Terraform Cloud / remote execution
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: If relevant, provide the version, tag, or commit SHA.
      placeholder: v1.2.3 or commit hash

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste the relevant Terraform or runtime configuration, sanitized as needed.
      placeholder: Paste the configuration here.

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Include any relevant error output, logs, or screenshots.
      placeholder: Paste logs or attach screenshots if helpful.
