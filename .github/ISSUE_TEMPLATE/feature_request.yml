name: Test Feature request
description: Suggest an improvement or new capability for the project
title: "Test"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm before submitting.
      options:
        - label: I searched existing issues and did not find a similar request
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem or limitation are you trying to address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives or workarounds have you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any screenshots, references, examples, or other context.
